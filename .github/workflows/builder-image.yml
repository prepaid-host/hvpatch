name: builder-image

# The builder image for unattended pipelines (docs/pipeline.md):
# ghcr.io/prepaid-host/hvpatch-builder, tagged sha-<commit> and main, with
# signed build provenance. Consumers pin it by digest.
on:
  push:
    branches: [main]
    paths:
      - builder/**
      - crates/**
      - Cargo.toml
      - Cargo.lock
      - .github/workflows/builder-image.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  image:
    # Manual runs too only from main: the image and its :main tag must come
    # from reviewed code.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/hvpatch-builder
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install stable --profile minimal --target x86_64-unknown-linux-musl && rustup default stable
      - run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: hvpatch-tool into the build context
        run: |
          cargo build --release --locked -p hvpatch-tool --target x86_64-unknown-linux-musl
          cp target/x86_64-unknown-linux-musl/release/hvpatch-tool builder/hvpatch-tool
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: builder
          file: builder/Containerfile
          push: true
          provenance: false
          tags: |
            ${{ env.IMAGE }}:sha-${{ github.sha }}
            ${{ env.IMAGE }}:main
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=GPL-2.0-only
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
      - name: summary
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: echo "${IMAGE}@${DIGEST}" | tee -a "$GITHUB_STEP_SUMMARY"
